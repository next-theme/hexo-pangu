name: Tester

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tester:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - run: npm test
